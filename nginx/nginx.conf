user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    client_max_body_size 100M;
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;

    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Resolución DNS interna de Docker: los nombres se re-resuelven cada 30s
    # (evita 502 cuando un container recreado cambia de IP).
    resolver 127.0.0.11 valid=30s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name localhost;

        # Cabeceras de seguridad
        add_header X-Content-Type-Options nosniff always;

        # ============= AUTH API =============
        location /auth/ {
            set $backend "auth-api:3001";
            proxy_pass http://$backend;
            include /etc/nginx/proxy_headers.conf;
        }

        # ============= MUSIC API (con streaming Range) =============
        location /api/music/ {
            set $backend "music-api:3002";
            proxy_pass http://$backend;
            proxy_buffering off;
            proxy_request_buffering off;
            include /etc/nginx/proxy_headers.conf;
        }

        # Portadas y archivos subidos
        location /uploads/ {
            set $backend "music-api:3002";
            proxy_pass http://$backend;
            include /etc/nginx/proxy_headers.conf;
        }

        # ============= RECOMMENDATIONS API =============
        location /api/recommendations/ {
            set $backend "reco-api:3003";
            proxy_pass http://$backend;
            include /etc/nginx/proxy_headers.conf;
        }

        # ============= WEBSOCKETS =============
        location /socket.io/music/ {
            set $backend "music-api:3002";
            proxy_pass http://$backend;
            proxy_buffering off;
            include /etc/nginx/proxy_headers.conf;
        }

        location /socket.io/reco/ {
            set $backend "reco-api:3003";
            proxy_pass http://$backend;
            proxy_buffering off;
            include /etc/nginx/proxy_headers.conf;
        }

        # Health del gateway
        location = /health {
            add_header Content-Type application/json;
            return 200 '{"status":"OK","service":"gateway"}';
        }

        # ============= FRONTEND (Next.js) =============
        location / {
            set $backend "web:3000";
            proxy_pass http://$backend;
            include /etc/nginx/proxy_headers.conf;
        }
    }
}
